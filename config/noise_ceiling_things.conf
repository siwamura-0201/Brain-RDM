# Config for run_noise_ceiling.sh
SUBJECTS="01 02 03"
FILE_TYPE="test"
# Distance metrics only -- "pearson" is the sign flip of "correlation" and
# is rejected by the ceiling code. "mahalanobis" was removed (its RDM was
# constant by construction); "crossnobis" replaces it.
METRICS="correlation euclidean_centered crossnobis"
# One comparator per rung, in rsatoolbox's names: L1 / L2 / L3.
# "kendall" is out (its ceiling is truncated upstream) and "rho-a" is out
# (numerically identical to spearman with no ties). See noise_ceiling.LEVELS.
COMPARATORS="cosine corr spearman"
MODEL_FOLDER="model_output"
MODEL_SUBSTRING="weights_sorted_fMRI1_test_100"
OUTPUT_DIR="results/noise_ceiling"
# Permutations for the null distribution; 0 skips it.
N_PERM="10000"
# Stimulus-bootstrap draws for the interval on the Nili bounds.
N_BOOT="1000"
